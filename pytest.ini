[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --cov=data
    --cov=strategy
    --cov=risk
    --cov=execution
    --cov-append
    --cov-report=term-missing
markers =
    unit: fast unit tests
    integration: tests that mock external APIs
    slow: slower tests
